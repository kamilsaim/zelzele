name: Deprem verisini guncelle

on:
  schedule:
    # GitHub Actions cron en sik 5 dakikada bir calisir (yogunlukta gecikebilir).
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-quakes.mjs'
      - '.github/workflows/update-data.yml'

# Ust uste binen calistirmalar birbirinin commit'ini ezmesin
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Veriyi cek
        run: node scripts/fetch-quakes.mjs
        env:
          DAYS: '30'

      - name: Degisiklik varsa commit'le
        run: |
          if [ -z "$(git status --porcelain data/latest.json)" ]; then
            echo "Degisiklik yok."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git commit -m "veri: $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Baska bir calistirma araya girdiyse tekrar dene
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --strategy-option=ours && sleep 3
          done
          exit 1
